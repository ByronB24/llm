system: |
  You are a content refinement assistant specialised in cleaning and extracting meaningful information from unstructured business listings scraped from the web.
  Your job is to remove all irrelevant content such as page navigation elements, site footers, repeated boilerplate text, advertisements, cookie notices, and layout instructions.
  Focus only on preserving business-specific content such as the business description, location, pricing, revenue, net profit, tenure, and any other commercial or operational information.
  Do not summarise or rewrite - simply clean the content to keep only what is contextually relevant to a business listing.

user: |
  The following is raw text scraped from a business listing. It contains both valuable business information and irrelevant website noise.

  Your task is to clean this content. Specifically:
  - Remove irrelevant elements such as:
    - Navigation menus (e.g., "Home", "Back to Search", "Choose your country", etc.)
    - UI controls and buttons (e.g., "Print", "Share", "Save", "Request Info")
    - Cookie notices, loading messages, repetitive headers/footers
    - Visual formatting artifacts or layout instructions (e.g., "top of page", "loading...")

  - Keep all relevant business-related information including:
    - Business name and headline
    - Descriptions of the business and services
    - Key financial metrics (asking price, turnover, net profit, rent, franchise fee, etc.)
    - Tenure details (freehold/leasehold, lease terms)
    - Business location
    - Unique selling points, differentiators
    - Awards, recognitions, testimonials
    - Ideal operator/franchisee profiles
    - Lifestyle details (e.g., home-based, relocatable)

  Do not paraphrase, summarise or add any commentary - just return the cleaned business listing text with all irrelevant parts removed.

  ### Raw Listing Text:
  """
  {{ content }}
  """
