providers:
  - id: openai:gpt-4

prompts:
  - id: simple-echo
    label: Simple Echo
    raw: |
      You are a helpful assistant. Keep answers short.
      Echo this back exactly: "{{content}}"

prompt: simple-echo

tests:
  - name: basic_echo
    vars:
      content: "Hello Promptfoo"
    assert:
      - type: contains
        value: "Hello Promptfoo"
